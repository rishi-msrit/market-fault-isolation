services:
  - type: web
    name: market-fault-isolation-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ingestion.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRIMARY_DSN
        sync: false
      - key: REPLICA_DSN
        sync: false
